<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <!-- Deixa o site funcionar bem em celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boletim Digital</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- CABEÇALHO -->
  <header class="cabecalho">
    <h1>Boletim Digital</h1>
    <p class="subtitulo">9º Ano — Estudante Exemplo</p>
  </header>

  <main class="conteudo">

    <!-- CARDS DE RESUMO -->
    <section class="cards" id="cardsResumo">
      <!-- Os cards serão criados pelo JavaScript -->
    </section>

    <!-- TABELA DE NOTAS -->
    <section class="area-tabela">
      <h2>Notas por disciplina</h2>

      <div class="tabela-responsiva">
        <table class="tabela-boletim">
          <thead>
            <tr>
              <th>Disciplina</th>
              <th>1º Tri</th>
              <th>2º Tri</th>
              <th>3º Tri</th>
              <th>Média</th>
              <th>Faltas</th>
              <th>Situação</th>
            </tr>
          </thead>
          <!-- As linhas serão criadas pelo JavaScript -->
          <tbody id="corpoTabela"></tbody>
        </table>
      </div>
    </section>

  </main>

  <footer class="rodape">
    <p>Projeto escolar — dados fictícios para demonstração.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
